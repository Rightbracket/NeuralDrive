# NeuralDrive is a headless CUDA-only appliance — we do not need DRM/KMS from
# the NVIDIA driver. NVIDIA 570.x defaults `nvidia-drm modeset=1`, which steals
# the framebuffer from efifb/simplefb mid-boot and leaves stale pixels stranded
# under the TTY console, producing flickering yellow/blue rectangles behind the
# TUI. Force-disable modeset and prevent nvidia-drm from auto-loading so the
# kernel's plain framebuffer console stays in charge of the screen.
options nvidia-drm modeset=0 fbdev=0
blacklist nvidia-drm
